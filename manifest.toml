#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "peanut"
name = "PeaNUT"
description.en = "A tiny dashboard for Network UPS Tools"
description.fr = "Tableau de bord de gestion d'onduleurs"

version = "6.0.0~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "Apache-2.0"
admindoc = "https://github.com/Brandawg93/PeaNUT/wiki"
userdoc = "https://github.com/Brandawg93/PeaNUT/wiki"
code = "https://github.com/Brandawg93/PeaNUT"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "1200M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/peanut"

    [install.init_main_permission]
    type = "group"
    default = "admins"

    [install.admin]
    type = "user"
    help.en = "Admin user (must be member of the admins group)"
    help.fr = "Compte administrateur (doit être membre du groupe admins)"
    
    [install.password]
    help.en = "Choose admin user password"
    help.fr = "Choisissez le mot de passe du compte d'administration"
    type = "password"
   
    [install.auth_disabled]
    ask.en = "Disabled authentication"
    ask.fr = "Enable authentication"
    type = "boolean"
    default = true

    [install.nut_host]
    ask.en = "First NUT Server host"
    ask.fr = "Hôte du premier serveur NUT"
    type = "string"
    optional = true

    [install.nut_port]
    ask.en = "NUT server port"
    ask.fr = "Port du serveur NUT"
    type = "number"
    default = 3493
    min = 0
    max = 65535
    optional = true
    
    [install.nut_username]
    ask.en = "NUT Server username"
    ask.fr = "Utilisateur du serveur NUT"
    type = "string"
    optional = true
    
    [install.nut_password]
    ask.en = "NUT Server password"
    ask.fr = "Mot de passe du serveur NUT"
    type = "password"
    optional = true
        
[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Brandawg93/PeaNUT/archive/refs/tags/v6.0.0.tar.gz"
    sha256 = "262c799bc41723191797175c469c872af3f96e9e9989220559712407d8b43a0b"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]


    [resources.permissions]
    main.url = "/"
    mail.allowed = "admins"
    
    [resources.ports]
    main.default = 8080

    [resources.apt]
    packages = "python3-bcrypt"

    [resources.nodejs]
    version = "24"

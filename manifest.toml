#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "peanut"
name = "PeaNUT"
description.en = "A tiny dashboard for Network UPS Tools"
description.fr = "Tableau de bord de gestion d'onduleurs"

version = "6.0.0~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "Apache-2.0"
admindoc = "https://github.com/Brandawg93/PeaNUT/wiki"
userdoc = "https://github.com/Brandawg93/PeaNUT/wiki"
code = "https://github.com/Brandawg93/PeaNUT"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/peanut"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Brandawg93/PeaNUT/archive/refs/tags/v6.0.0.tar.gz"
    sha256 = "262c799bc41723191797175c469c872af3f96e9e9989220559712407d8b43a0b"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]


    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"

    [resources.ports]
    main.default = 8080

    [resources.apt]


    [resources.nodejs]
    version = "24"

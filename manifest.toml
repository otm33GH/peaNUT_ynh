#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "keycloakify"
name = "Keycloakify"
description.en = "Keycloak theming for the modern web"
description.fr = "Créateur de thèmes pour Keycloak"

version = "11.16.0~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "MIT" 
website = "https://www.keycloakify.dev/"
demo = "https://storybook.keycloakify.dev/?path=/story/introduction--what-is-this-website"
admindoc = "https://docs.keycloakify.dev/"
userdoc = "https://docs.keycloakify.dev/"
code = "https://github.com/keycloakify/keycloakify"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/keycloakify"

    [install.init_main_permission]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    # This won't be saved as setting and will instead be used to initialize the SSOwat permission
    type = "group"
    default = "visitors"



[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/keycloakify/keycloakify/archive/refs/tags/v11.16.0.tar.gz"
    sha256 = "014fd68e0fd068f2076a486cfbe18179ec509ada027eb5926f009131e72b0b5e"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]


    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]


    [resources.nodejs]
    version = "24"
